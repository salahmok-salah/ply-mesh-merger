name: Build Windows Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      # Suppresses the runner deprecation warning for forced Node upgrades
      ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Compile EXE with PyInstaller
      run: |
        pyinstaller --noconsole --onefile --name "PLY_Merger" merge_gui.py

    - name: Upload Binary Artifact
      uses: actions/upload-artifact@v4
      with:
        name: PLY_Merger_Executable
        path: dist/PLY_Merger.exe
